name: Verify
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'pxui/Cargo.lock', 'packaging/build-sdl-macos.sh') }}
      - name: Check pinned pxui commit
        run: tools/check-pxui-remote.sh
      - name: Check iOS development commands (offline)
        run: python3 packaging/test_ios.py
      - name: Check Rust formatting
        run: cargo fmt -p lw_sqlite -p lw_core -p lw_apple_sys -p lw_ui -p lw_bin --check
      - name: Check Rust core and warm shell allocation contract
        run: cargo t -p lw_sqlite -p lw_core -p lw_apple_sys -p lw_ui
      - name: Build signed sandboxed Rust bundle
        run: make bundle
      - name: Check warmed host input allocation contract
        run: cargo t -p lw_bin
      - name: Check Rust lints
        run: cargo clippy --locked -p lw_sqlite -p lw_core -p lw_apple_sys -p lw_ui -p lw_bin --all-targets --features lw_apple_sys/interop-test -- -D warnings

  pxui:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: pxui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pxui/Cargo.lock', 'pxui/rust-toolchain.toml', 'packaging/build-sdl-macos.sh') }}
      - name: Build static SDL
        run: make target/sdl/lib/libSDL3.a
      - name: Check pxui without Metal windows
        working-directory: pxui
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          PKG_CONFIG: ${{ github.workspace }}/tools/pkg-config-static.sh
          PKG_CONFIG_PATH: ${{ github.workspace }}/target/sdl/lib/pkgconfig
          PXUI_CONSUMER_DEFAULT_STACK: "1"
        run: |
          cargo t -p pxui_render partial_equals_full_mock
          cases=$(cargo t -p pxui_host --list | sed -n '/^pxui_host::window_/d; s/^pxui_host::\(.*\): test$/\1/p')
          test -n "$cases"
          for case_name in $cases; do
            cargo t -p pxui_host "$case_name"
          done
          cargo t -p pxui
          for gate in shape deps tiers records abi-header abi-snapshot abi-exports abi-frozen abi-compat; do
            cargo run -q -p gate -- "$gate"
          done

  pxui-lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Vulkan software driver and validation
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libdbus-1-dev glslang-tools spirv-tools
      - name: Check headless core and the native renderer oracle
        working-directory: pxui
        run: |
          VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -f "$VK_DRIVER_FILES"
          export VK_DRIVER_FILES
          cargo t -p pxui_core --test pxui_all --test string_pool
          cargo t -p pxui_render gpu_partial_equals_full
          RAYS_SLOW=1 cargo t --profile default -p pxui_render gpu_partial_equals_full
