name: Unsigned release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the verified commit
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - run: swift test
      - name: Build unsigned device app
        run: bash scripts/build-unsigned-ipa.sh "$RUNNER_TEMP/unsigned"
      - name: Create release with sideloading instructions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/unsigned/* --verify-tag --title "LocalWave $RELEASE_TAG" --notes-file docs/unsigned-release-notes.md
